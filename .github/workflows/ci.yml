# Runs the tests on every push to main and on every pull request.
# A red cross on a pull request means a test failed: fix it before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chess rules
        run: pytest -v tests/test_game_rules.py

      - name: Shared interface
        run: pytest -v tests/test_interface.py

      - name: Game logic
        run: pytest -v tests/test_game.py

      - name: Engine contract
        run: pytest -v -rs tests/test_engine_contract.py

      - name: Evaluation functions
        run: pytest -v -rs tests/test_evaluation.py
